<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's Visit Korea Blog</title>
  <meta name="description" content="한국 지역별 영상 속 맛집·명소 소개 글">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9480f'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="blog.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="logo" aria-hidden="true">▶</span><h1>Let's Visit Korea</h1></a>
    <nav class="bp-nav">
      <button class="bp-switch" data-to="ko">한국어</button>
      <button class="bp-switch" data-to="en">English</button>
      <select id="moreLangs" class="bp-langsel" aria-label="language" hidden onchange="if(this.value)location.href=this.value"></select>
    </nav>
  </header>
  <main class="bp-main">
    <h1 id="heading">블로그</h1>
    <ul id="list" class="bp-list"></ul>
  </main>
  <footer class="foot site-foot">
    <a href="../about.html">소개 · About</a> · <a href="../privacy.html">개인정보처리방침 · Privacy</a>
  </footer>
  <script src="../data/hidden-videos.js"></script>
  <script src="../data/blog-langs.js"></script>
  <script>
    (function () {
      var hidden = window.HIDDEN_VIDEOS || [];
      // 표지: 글의 영상 중 삭제·비공개되지 않은 첫 영상
      function coverOf(p) {
        var ids = p.videos || (p.cover ? [p.cover] : []);
        for (var i = 0; i < ids.length; i++) if (hidden.indexOf(ids[i]) === -1) return ids[i];
        return null;
      }
      var lang; try { lang = localStorage.getItem("kt.lang"); } catch (e) {}
      var q = new URLSearchParams(location.search).get("lang");
      if (q) lang = q;
      lang = lang === "ko" || !lang ? "ko" : "en";
      // 다른 언어 블로그 (번역된 글이 있는 언어만)
      var more = window.BLOG_LANGS || [];
      var labels = { ja: "日本語", "zh-Hans": "简体中文", "zh-Hant": "繁體中文", es: "Español", fr: "Français", de: "Deutsch", vi: "Tiếng Việt", th: "ไทย", id: "Bahasa Indonesia", ru: "Русский" };
      if (more.length) {
        var sel = document.getElementById("moreLangs");
        sel.innerHTML = '<option value="">🌏 …</option>' + more.map(function (l) { return '<option value="' + l + '/index.html">' + labels[l] + "</option>"; }).join("");
        sel.hidden = false;
      }
      var posts = [];
      function render() {
        document.documentElement.lang = lang;
        document.getElementById("heading").textContent = lang === "ko" ? "블로그" : "Blog";
        var ul = document.getElementById("list");
        ul.innerHTML = "";
        if (!posts.length) {
          var e = document.createElement("li");
          e.className = "bp-empty";
          e.textContent = lang === "ko" ? "아직 글이 없어요." : "No posts yet.";
          ul.appendChild(e);
        }
        posts.forEach(function (p) {
          var li = document.createElement("li"); li.className = "bp-item";
          var a = document.createElement("a"); a.href = "posts/" + p.slug + ".html?lang=" + lang;
          var img = document.createElement("img"); img.alt = ""; img.loading = "lazy";
          var cover = coverOf(p);
          if (cover) img.src = "https://i.ytimg.com/vi/" + cover + "/hqdefault.jpg";
          var box = document.createElement("div");
          var h = document.createElement("h2"); h.textContent = p.title[lang];
          var s = document.createElement("p"); s.textContent = p.date + " · " + p.summary[lang];
          box.appendChild(h); box.appendChild(s); a.appendChild(img); a.appendChild(box); li.appendChild(a); ul.appendChild(li);
        });
      }
      document.querySelectorAll(".bp-switch").forEach(function (b) {
        b.onclick = function () { lang = b.dataset.to; try { localStorage.setItem("kt.lang", lang); } catch (e) {} render(); };
      });
      fetch("posts.json").then(function (r) { return r.json(); }).then(function (x) { posts = x; render(); }).catch(render);
    })();
  </script>
  
  <script src="/analytics.js" defer></script>
</body>
</html>
