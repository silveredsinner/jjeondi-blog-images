name: Admin worker deploy
on:
  push:
    branches: [main]
    paths: ["admin-worker/**", ".github/workflows/admin-worker-deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOGIN_PASSWORD: ${{ secrets.LVK_ADMIN_PASSWORD }}
          LOGIN_EMAIL: ${{ vars.LVK_ADMIN_EMAIL }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ "${#LOGIN_PASSWORD}" -lt 20 ] || [ -z "$LOGIN_EMAIL" ]; then
            echo "::notice::Waiting for administrator credentials (password 20+ characters)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Test authentication
        if: steps.check.outputs.ready == 'true'
        run: node admin-worker/auth.test.mjs
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.LVK_ADMIN_PASSWORD }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin-worker
          secrets: |
            CF_ANALYTICS_TOKEN
            ADMIN_PASSWORD
          command: >-
            deploy
            --var CF_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            --var ADMIN_EMAIL:${{ vars.LVK_ADMIN_EMAIL }}
      - name: Verify authenticated statistics and anonymous protection
        if: steps.check.outputs.ready == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.LVK_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.LVK_ADMIN_EMAIL }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://letsvisitkorea-admin.kdhfighter.workers.dev';
          const login = await fetch(base+'/login', {method:'POST', redirect:'manual', headers:{Origin:base,'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({email:process.env.ADMIN_EMAIL,password:process.env.ADMIN_PASSWORD})});
          if(login.status!==303)throw new Error('Login verification failed: '+login.status);
          const cookie=login.headers.get('set-cookie').split(';')[0];
          const stats=await fetch(base+'/api/stats?days=7',{headers:{cookie}});
          const data=await stats.json();
          if(!stats.ok||!data.total||!Array.isArray(data.series))throw new Error('Stats verification failed: '+(data.error||stats.status));
          const denied=await fetch(base+'/api/stats');
          if(denied.status!==401)throw new Error('Anonymous stats must be denied');
          console.log('Authenticated statistics and anonymous protection verified.');
          NODE
