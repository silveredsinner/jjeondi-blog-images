# letsvisitkorea.com 트래픽 관리자 페이지를 Cloudflare Worker 로 배포한다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Account Analytics: Read), CLOUDFLARE_ACCOUNT_ID
# 필요한 저장소 Variables (Cloudflare Access 를 켠 뒤): ACCESS_TEAM_DOMAIN (예: xxx.cloudflareaccess.com), ACCESS_AUD
# 이 저장소는 공개라서 로그에는 트래픽 숫자를 남기지 않는다 (조회 성공/실패만).
name: Admin worker deploy

on:
  push:
    branches: [main]
    paths: ["admin-worker/**", ".github/workflows/admin-worker-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID Secrets 가 없어서 배포를 건너뛰어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Web Analytics 조회 확인 (결과 숫자는 출력하지 않음)
        if: steps.check.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
          const end = new Date(), start = new Date(end - 864e5);
          const query = `query ($a: String!, $f: AccountRumPageloadEventsAdaptiveGroupsFilter_InputObject) { viewer { accounts(filter: { accountTag: $a }) {
            rumPageloadEventsAdaptiveGroups(filter: $f, limit: 1) { count sum { visits } dimensions { date } } } } }`;
          const f = { AND: [{ datetime_geq: start.toISOString(), datetime_lt: end.toISOString() }, { requestHost: "letsvisitkorea.com" }, { bot: 0 }] };
          fetch("https://api.cloudflare.com/client/v4/graphql", { method: "POST", headers: { authorization: "Bearer " + process.env.CF_TOKEN, "content-type": "application/json" }, body: JSON.stringify({ query, variables: { a: process.env.CF_ACCOUNT, f } }) })
            .then((r) => r.json()).then((b) => {
              if (b.errors && b.errors.length) { console.log("::error::Web Analytics 조회 실패: " + b.errors.map((e) => e.message).join("; ")); process.exit(1); }
              console.log("Web Analytics 조회 OK (계정 " + (b.data.viewer.accounts.length ? "찾음" : "못 찾음") + ")");
            });'
      - name: Worker 배포
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin-worker
          secrets: CF_ANALYTICS_TOKEN
          command: >-
            deploy
            --var CF_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            --var ACCESS_TEAM_DOMAIN:${{ vars.ACCESS_TEAM_DOMAIN || 'unset' }}
            --var ACCESS_AUD:${{ vars.ACCESS_AUD || 'unset' }}
