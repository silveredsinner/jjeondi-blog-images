# Korea Tube: 영상 설명란·댓글에서 맛집을 뽑고 블로그 글 초안을 만들어 PR 로 올린다.
# 필요한 저장소 Secrets: YOUTUBE_API_KEY, ANTHROPIC_API_KEY
# 필요한 설정: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests" 체크
name: Korea Tube content

on:
  schedule:
    - cron: "17 0 * * 1" # 매주 월요일 09:17 (한국 시간)
  workflow_dispatch:
    inputs:
      max_videos:
        description: "한 번에 처리할 영상 수"
        default: "15"
      only_shows:
        description: "방송 프로그램 영상만 처리 (1 = 예)"
        default: "0"
      blog_region:
        description: "이 지역 글을 강제로 쓰기 (예: busan, 여러 지역은 seoul,jeju). 비우면 새 장소가 모인 지역만"
        default: ""
      discover:
        description: "유튜브에서 새 영상 찾기: mukbang, beauty (쉼표로 여러 개). 비우면 안 찾음"
        default: ""
      discover_regions:
        description: "새 먹방 찾기를 이 지역만 (예: busan,gangwon,jeonbuk). 비우면 전국"
        default: ""
      blog_topics:
        description: "주제별 블로그 글 쓰기 (1 = 예, 아직 안 쓴 주제만)"
        default: "0"
      translate_blog:
        description: "블로그 글을 10개 언어로 번역 (1 = 예). 매주 실행 때는 새 글만 자동 번역"
        default: "0"
      only_check:
        description: "영상 점검(삭제 영상 숨기기·조회수·자막)만 하기 (1 = 예, Claude API 안 씀)"
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: korea-tube-content
  cancel-in-progress: false

jobs:
  # 지난 실행의 확인용 PR 이 아직 열려 있으면 정기 실행은 건너뛴다.
  # (새 실행이 PR 브랜치를 덮어써서 병합 전 결과를 버리고, 같은 번역에 API 비용을 또 쓰는 것을 막음)
  guard:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.pr.outputs.open }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list -R "${{ github.repository }}" --head korea-tube/auto-content --state open --json number --jq length)
          echo "open=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "::notice::확인용 PR 이 아직 열려 있어요. 병합(또는 닫기)한 뒤 다음 실행부터 진행돼요." || true

  enrich:
    needs: guard
    if: needs.guard.outputs.open != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: korea-tube/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: korea-tube/scripts/package-lock.json
      - run: npm ci
      - name: 영상 설명란·댓글에서 맛집 찾기
        if: inputs.only_check != '1'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_VIDEOS: ${{ inputs.max_videos || '15' }}
          ONLY_SHOWS: ${{ inputs.only_shows || '0' }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node enrich.mjs
      - name: 블로그 글 초안 쓰기
        if: inputs.only_check != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_REGION: ${{ inputs.blog_region }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node blog.mjs
      - name: 주제별 블로그 글 (서울 길거리 음식, K-뷰티 등)
        if: inputs.blog_topics == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node blog-topics.mjs
      - name: 블로그 글 번역 (일본어·중국어 등 10개 언어, 새 글만)
        if: inputs.only_check != '1' || inputs.translate_blog == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node translate-blog.mjs
      - name: 지역 페이지 번역 (음식·명소·장소 이름, 바뀐 지역만)
        if: inputs.only_check != '1' || inputs.translate_blog == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node translate-regions.mjs
      - name: 새 영상 찾기 (먹방·K-뷰티, 퍼가기 허용 영상만)
        if: inputs.discover != ''
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCOVER: ${{ inputs.discover }}
          DISCOVER_REGIONS: ${{ inputs.discover_regions }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node discover.mjs
      - name: 영상 상태 점검 (삭제·비공개 영상 숨기기, 조회수)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REVIEW_FILE: ${{ runner.temp }}/review.md
        run: node check-videos.mjs
      - name: 확인용 PR 만들기
        # 앞 단계 하나가 실패해도 그때까지 만든 결과(번역·글 등)는 PR 로 남긴다
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: korea-tube/auto-content
          delete-branch: true
          add-paths: |
            korea-tube/data/places-auto.js
            korea-tube/data/hidden-videos.js
            korea-tube/data/video-subs.js
            korea-tube/data/video-views.js
            korea-tube/data/videos-auto.js
            korea-tube/data/blog-langs.js
            korea-tube/data/auto/**
            korea-tube/blog/**
          commit-message: "Korea Tube: 영상 속 맛집 자동 추출 + 블로그 초안"
          title: "Korea Tube 자동 업데이트: 맛집 정보·블로그 초안"
          body-path: ${{ runner.temp }}/review.md
