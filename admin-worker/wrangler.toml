# letsvisitkorea.com 트래픽 관리자 페이지 (Cloudflare Worker). 배포: .github/workflows/admin-worker-deploy.yml
name = "letsvisitkorea-admin"
main = "worker.js"
compatibility_date = "2026-09-01"
