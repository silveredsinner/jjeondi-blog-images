<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>이 기기 방문 집계 설정 | Let's Visit Korea</title>
<style>body{margin:0;background:#f5f5f1;color:#172b34;font:16px/1.7 system-ui}main{max-width:540px;margin:10vh auto;padding:30px;background:white;border-radius:18px}button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:8px;background:#15565a;color:white;cursor:pointer}a{color:#15565a}small{color:#58656b}#status{font-weight:700}</style></head>
<body><main><small>LET'S VISIT KOREA</small><h1>이 기기 방문 집계 설정</h1><p id="status" role="status">설정을 확인하고 있습니다.</p><p>이 설정은 현재 브라우저에서 앞으로 방문하는 페이지에 적용됩니다. 기존 통계는 변경하지 않습니다.</p><p>이미 열어둔 여행 사이트 탭은 새로고침해주세요. 다른 브라우저·기기는 각각 설정해야 하며, 사이트 데이터를 지우면 설정도 초기화됩니다.</p><button id="toggle" disabled>설정 확인 중</button><p><a href="https://letsvisitkorea-admin.kdhfighter.workers.dev/">관리자 화면으로 돌아가기</a> · <a href="/?lang=ko">여행 사이트 열기</a></p></main>
<script>
(function(){
  var key='lvk_analytics_excluded',status=document.getElementById('status'),button=document.getElementById('toggle');
  function render(){var excluded=localStorage.getItem(key)==='1';status.textContent=excluded?'이 브라우저의 방문 집계가 제외되었습니다.':'이 브라우저의 방문을 집계합니다.';button.textContent=excluded?'다시 집계하기':'이 기기 방문 집계 제외';button.disabled=false;}
  function failed(){status.textContent='브라우저가 설정 저장을 차단했습니다. 사이트 저장소를 허용한 뒤 다시 시도해주세요.';button.disabled=true;}
  try{if(location.hash==='#exclude'){localStorage.setItem(key,'1');history.replaceState(null,'',location.pathname);}render();}catch(_){failed();}
  button.addEventListener('click',function(){try{if(localStorage.getItem(key)==='1')localStorage.removeItem(key);else localStorage.setItem(key,'1');render();}catch(_){failed();}});
})();
</script></body></html>
